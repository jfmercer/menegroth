---
name: CodeQL

# CodeQL "actions" language pack: semantic analysis of the workflow files
# (untrusted-input flow, injection, secrets misuse). This repo has no other
# CodeQL-supported language — Terraform/HCL, shell, and YAML aren't — so
# `actions` is the whole matrix. Advanced setup (this file) is used; do NOT
# also enable default setup in the repo settings, they conflict.

on:
  pull_request:
    paths: [".github/**"]
  push:
    branches: [master]
    paths: [".github/**"]
  schedule:
    - cron: "17 6 * * 1" # weekly: new queries against unchanged code

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # clone the repo
      security-events: write # upload analysis results
      actions: read # analyze reads workflow-run info
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
