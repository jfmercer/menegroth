---
name: Ansible

on:
  pull_request:
    paths: ["ansible/**", ".github/workflows/ansible.yml"]
  push:
    branches: [master]
    paths: ["ansible/**", ".github/workflows/ansible.yml"]

permissions:
  contents: read

concurrency:
  group: ansible
  cancel-in-progress: false

defaults:
  run:
    working-directory: ansible

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible tooling
        run: pip install ansible-core ansible-lint
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check
        run: ansible-playbook site.yml --syntax-check

  provision:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: https://eu.infisical.com
          project-slug: secure-ai-server
          env-slug: prod
          secret-path: /ci
          export-type: env

      # The server has zero public inbound ports; the runner joins the
      # tailnet as an ephemeral node tagged tag:ci and connects over
      # Tailscale SSH (authorized by the tailnet ACL "ssh" section).
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: pip install ansible-core
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False" # host keys are vouched by Tailscale SSH
        run: ansible-playbook site.yml
