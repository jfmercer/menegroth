---
name: Teardown

# Deletes all of the project's infrastructure (docs/runbooks/teardown.md,
# D15). First it switches off the workflows that would deploy, build, or
# probe the server. Then it lifts delete protection, `terraform destroy`
# deletes the server, the /data volume, the Primary IPs, the firewall, and
# the SSH key, and scripts/ci/teardown.sh deletes the rest: the server's
# backups, the FDE snapshots, image-test and Packer leftovers, and the
# server's tailnet nodes. It ends by proving nothing of menegroth's is left. Irreversible: no copy
# of /data survives. Accounts and credentials stay (the runbook covers them).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          IRREVERSIBLE. Deletes the server, its backups, the /data volume and
          everything on it, every image, and the server's tailnet nodes, then
          disables the deploy workflows. Type: destroy menegroth-server
        type: string
        required: true

permissions: {} # granted per-job below

concurrency:
  group: teardown
  cancel-in-progress: false

# An explicit shell makes GitHub run steps with -o pipefail, so the final
# check's failure isn't masked by the `| tee` that records its results.
defaults:
  run:
    shell: bash

jobs:
  # Its own job, so only these steps hold actions: write, and no secrets.
  freeze:
    name: Confirm + switch off the deploy workflows
    runs-on: ubuntu-26.04
    permissions:
      actions: write # disable workflows, list Packer runs
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Run the teardown from master, not $GITHUB_REF: a dispatch runs the branch's code."
            exit 1
          fi
          if [[ "$CONFIRM" != "destroy menegroth-server" ]]; then
            echo "::error::The confirmation must be exactly 'destroy menegroth-server'. Nothing was changed."
            exit 1
          fi

      # First, so nothing deploys, rebuilds, or probes the server while it is
      # deleted, or brings it back after: a merge would otherwise apply, and
      # the daily Verify would fail forever. The lint workflows stay on.
      # Re-enable them to rebuild (docs/runbooks/teardown.md).
      - name: Disable the workflows that deploy, build, or probe the server
        run: |
          for wf in terraform.yml ansible.yml packer.yml verify.yml renovate.yml; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" --jq .state)"
            if [[ "$state" == active ]]; then
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/disable"
              echo "disabled $wf"
            else
              echo "$wf is already $state"
            fi
          done

      # A Packer build creates servers and a snapshot as it goes; any made
      # after the sweep would outlive the teardown. (A Terraform apply can't
      # overlap: the destroy job below shares its concurrency group.) The
      # REST API, not `gh run list`: that skips the now-disabled workflow.
      - name: Refuse while a Packer build is running
        run: |
          busy="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/packer.yml/runs?per_page=20" \
            --jq '.workflow_runs[] | select(.status != "completed") | .html_url')"
          if [[ -n "$busy" ]]; then
            echo "::error::A Packer run is still going: $busy. Let it finish (or cancel it and let its cleanup steps run), then dispatch the teardown again. Nothing was deleted."
            exit 1
          fi

  destroy:
    name: Destroy everything
    needs: freeze
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read # clone the repo
    # The Terraform workflow's apply group: never alongside an apply.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: https://eu.infisical.com
          project-slug: menegroth
          env-slug: prod
          secret-path: /ci
          export-type: env

      - name: Map admin SSH key to a Terraform variable
        run: echo "TF_VAR_admin_ssh_public_key=$ADMIN_SSH_PUBLIC_KEY" >> "$GITHUB_ENV"

      # Before anything is deleted: a missing devices OAuth client would
      # otherwise surface only after the server is gone, stranding its node.
      - name: Check the credentials
        id: preflight
        run: scripts/ci/teardown.sh preflight

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform
        run: terraform init -input=false

      # hcloud deletes without lifting delete protection, and Hetzner refuses
      # (423 protected) for the /data volume and the Primary IPs: the first
      # production run failed that way. scripts/ci/tests/teardown-destroy-test.sh
      # runs these steps against a mock that enforces it.
      - name: Lift delete protection
        run: scripts/ci/teardown.sh unprotect

      # An empty state means an earlier run got past this step; skip it, since
      # destroy still reads the FDE-image data source and the sweep has since
      # deleted every image.
      - name: terraform destroy
        working-directory: terraform
        run: |
          resources="$(terraform state list)"
          if [[ -z "$resources" ]]; then
            echo "The Terraform state is empty: nothing to destroy."
            exit 0
          fi
          terraform destroy -input=false -auto-approve -lock-timeout=10m

      - name: Delete what Terraform doesn't manage
        run: scripts/ci/teardown.sh sweep

      - name: Check nothing is left
        if: always() && steps.preflight.outcome == 'success'
        run: scripts/ci/teardown.sh check | tee "$RUNNER_TEMP/results.txt"

      - name: Summary
        if: always()
        run: scripts/verify/summary.sh "Teardown" "$RUNNER_TEMP/results.txt" >> "$GITHUB_STEP_SUMMARY"
