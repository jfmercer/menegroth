---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.27.0
    hooks:
      - id: zizmor

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
      - id: terraform_tflint

  # Local hooks reuse the uv-locked toolchain (pyproject.toml + uv.lock), so
  # there is one ansible-lint version, not a second pre-commit-pinned copy.
  - repo: local
    hooks:
      # Run from ansible/ so ansible/.ansible-lint (which excludes the
      # installed Galaxy collections) and ansible.cfg are picked up.
      - id: ansible-lint
        name: ansible-lint
        entry: bash -c 'cd ansible && uv run --frozen ansible-lint'
        language: system
        files: ^ansible/
        pass_filenames: false
      # Same check as .github/workflows/shellcheck.yml (needs shellcheck).
      - id: shellcheck-all
        name: shellcheck (scripts + rendered Ansible templates)
        entry: scripts/ci/shellcheck-all.sh
        language: system
        files: ^(scripts|macos|packer|ansible/roles|ansible/group_vars)/|^\.shellcheckrc$
        pass_filenames: false
