---
admin_user: admin

# Infisical project holding this server's secrets (ID is not sensitive).
# REPLACE during bootstrap: Infisical console → project settings → Project ID.
infisical_project_id: REPLACE_WITH_PROJECT_ID

# Window for unattended-upgrades automatic reboots (UTC). Chosen for
# Mac-awake hours: the FDE root needs the Mac unlock agent (macos/) to
# finish a reboot, so reboots happen in the evening, not at night.
unattended_reboot_time: "19:00"
