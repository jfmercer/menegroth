---
- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present

- name: Install restic backup script
  ansible.builtin.template:
    src: restic-backup.sh.j2
    dest: /usr/local/bin/restic-backup
    owner: root
    group: root
    mode: "0750"

- name: Install restic service
  ansible.builtin.copy:
    dest: /etc/systemd/system/restic-backup.service
    content: |
      [Unit]
      Description=Backup /data with restic
      Requires=data-volume.service
      After=data-volume.service network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/restic-backup
      Nice=10
      IOSchedulingClass=idle
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install restic timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/restic-backup.timer
    content: |
      [Unit]
      Description=Nightly /data backup

      [Timer]
      OnCalendar={{ ops_restic_schedule }}
      Persistent=true
      RandomizedDelaySec=10min

      [Install]
      WantedBy=timers.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable restic timer
  ansible.builtin.systemd_service:
    name: restic-backup.timer
    enabled: true
    state: started
