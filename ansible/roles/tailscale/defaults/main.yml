---
tailscale_hostname: "{{ inventory_hostname }}"
# SHA-256 of Tailscale's apt signing key (same key for every Ubuntu series).
# A key rotation fails the play loudly — verify upstream, then bump.
tailscale_apt_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
# Pre-authorized, reusable auth key tagged tag:server, stored in Infisical
# at /ci/TS_SERVER_AUTHKEY and exported as an env var for the play. Only
# consulted when the node is not yet joined.
tailscale_authkey: "{{ lookup('ansible.builtin.env', 'TS_SERVER_AUTHKEY', default='') }}"
