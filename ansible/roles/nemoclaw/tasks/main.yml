---
- name: Require the encrypted volume to be mounted
  ansible.builtin.command: mountpoint -q /data
  changed_when: false

- name: Configure swap
  ansible.builtin.import_tasks: swap.yml

- name: Install and configure Docker
  ansible.builtin.import_tasks: docker.yml

# docker group membership is ROOT-EQUIVALENT (NemoClaw requires Docker
# access; its docs say so). The agents' isolation boundary is the OpenShell
# sandbox, not this Unix user — see docs/architecture.md D5.
- name: Create nemoclaw user (home on the encrypted volume)
  ansible.builtin.user:
    name: "{{ nemoclaw_user }}"
    uid: "{{ nemoclaw_uid }}"
    home: "{{ nemoclaw_home }}"
    shell: /bin/bash
    system: false
    create_home: true
    groups: [docker]
    append: true

- name: Enable linger so always-on agents survive without a login session
  ansible.builtin.command: loginctl enable-linger {{ nemoclaw_user }}
  args:
    creates: /var/lib/systemd/linger/{{ nemoclaw_user }}

- name: Ensure slice drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/user-{{ nemoclaw_uid }}.slice.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Only the nemoclaw CLI/Node processes run here — the containers are capped
# by nemoclaw.slice (docker.yml).
- name: Cap nemoclaw user slice memory (CLI processes)
  ansible.builtin.copy:
    dest: /etc/systemd/system/user-{{ nemoclaw_uid }}.slice.d/50-memory.conf
    content: |
      [Slice]
      MemoryHigh={{ nemoclaw_memory_high }}
      MemoryMax={{ nemoclaw_memory_max }}
      TasksMax=2048
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure user-manager drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/user@{{ nemoclaw_uid }}.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Linger starts the nemoclaw user manager at boot, but its home (and all
# agent state) lives on /data, which data-volume.service mounts only after
# fetching the key from Infisical. Without this ordering the agents can start
# against the bare mount-point directory on the root disk.
- name: Start the nemoclaw user manager only after /data is mounted
  ansible.builtin.copy:
    dest: /etc/systemd/system/user@{{ nemoclaw_uid }}.service.d/50-data-volume.conf
    content: |
      [Unit]
      Requires=data-volume.service
      After=data-volume.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install nemoclaw-install wrapper
  ansible.builtin.template:
    src: nemoclaw-install.sh.j2
    dest: /usr/local/bin/nemoclaw-install
    owner: root
    group: root
    mode: "0750"

# The marker lives on the ROOT disk, next to what the installer puts there
# (Docker images, OpenShell, k3s state). A replacement server keeps /data but
# gets a fresh root, so it must re-run the installer; a marker on /data would
# wrongly skip it.
- name: Ensure provisioning-marker directory exists
  ansible.builtin.file:
    path: /var/lib/nemoclaw-provisioned
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Run the pinned NemoClaw installer (once per release, per root disk)
  ansible.builtin.command: /usr/local/bin/nemoclaw-install
  args:
    creates: /var/lib/nemoclaw-provisioned/{{ nemoclaw_install_tag }}
  # The wrapper exports the provider API key (when configured) into the
  # installer env.
  no_log: true
