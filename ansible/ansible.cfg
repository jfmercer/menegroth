[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = accept_new
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
# Run notified handlers even when a later task fails. Otherwise a failed run
# leaves written config unapplied (e.g. a systemd drop-in with no
# daemon-reload), and the next run sees the file unchanged and never
# notifies again.
force_handlers = True

[ssh_connection]
pipelining = true
